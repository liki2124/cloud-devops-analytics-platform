
name: Cloud DevOps Platform CI

on:
  push:
    branches:
      - main
      - feature/it-operations-database

  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Scan Python dependencies for vulnerabilities
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
      - name: Run automated tests
        run: python -m pytest -v tests

      - name: Validate Prometheus configuration
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "$GITHUB_WORKSPACE/prometheus:/etc/prometheus:ro" \
            prom/prometheus:latest \
            check config /etc/prometheus/prometheus.yml
      - name: Validate Prometheus alert rules
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "$GITHUB_WORKSPACE/prometheus:/etc/prometheus:ro" \
            prom/prometheus:latest \
            check rules /etc/prometheus/rules/alerts.yml  

      - name: Build Docker image
        run: docker build -t cloud-devops-analytics-platform:ci .
